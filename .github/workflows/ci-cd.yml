name: CI Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Tests Python
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Préparer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Vérifier l'environnement
        run: |
          python --version
          python -m pip --version

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Vérifier la syntaxe Python
        run: python -m compileall -q app tests

      - name: Exécuter les tests
        run: python -m pytest -v

  deploy_staging:
    name: Préparer la livraison
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Préparer les fichiers à livrer
        run: |
          mkdir -p dist
          cp -r app README.md dist/
          cd dist
          zip -r ../calculator.zip app README.md

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-${{ github.sha }}
          path: calculator.zip
          if-no-files-found: error
          retention-days: 7
 
  deploy_production:
    name: Vérifier la livraison
    needs: deploy_staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production

    steps:
      - name: Vérifier la disponibilité de l'artefact
        run: |
          echo "Artefact publié lors de l'étape précédente."
          echo "Aucun déploiement réel n'est effectué."
          echo "Commit : $GITHUB_SHA"